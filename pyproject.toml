[project]
name = "on-traits-and-phenotypes"
version = "0.1.0"
description = "A paper, blog, and presentations on traits and phenotypes"
requires-python = ">=3.10"
dependencies = ["presentation-sanity", "document-sanity"]

[tool.uv]
package = false

[tool.uv.sources]
presentation-sanity = { path = "../../personal-projects/presentation-sanity", editable = true }
document-sanity = { path = "../../personal-projects/document-sanity", editable = true }

[tool.uv.workspace]
members = ["paper", "presentation"]
