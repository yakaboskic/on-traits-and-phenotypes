# presentation-sanity manifest — the single source of configuration for this
# subject. Shared inputs (variables, scenes, figures) feed every printout
# declared under `outputs:`.

metadata:
  title: "On Traits and Phenotypes"
  description: "On Traits and Phenotypes"
  authors:
    - name: "Chase Yakaboski"
      email: "chase.yakaboski@simage.ai"

# ─── Outputs ────────────────────────────────────────────────────────────────
outputs:
  blog:
    engine: vitepress
    entry: blog.md              # rewritten to `/` in the built site
    out: site/blog

    # ── Theming levers, all forwarded into the generated VitePress config ──
    # Lifted into themeConfig:   nav, sidebar, socialLinks, outline, footer
    # Any other theme option:    themeConfig: { logo, search, editLink, aside, … }
    # Any other site option:     vitepress:  { appearance, lang, titleTemplate, … }
    # Also accepted here: base (ABSOLUTE prefix), head, markdown, exclude,
    # lastUpdated, title, description.
    outline: [2, 3]
    # themeConfig:
    #   aside: false           # drop the right-hand outline rail
    # vitepress:
    #   appearance: dark       # true | false | 'dark' | 'force-dark'

  # To also deliver this as a talk, add slides.md and uncomment. It reuses the
  # same variables, scenes and figures — nothing below changes.
  # slides:
  #   engine: slidev
  #   entry: slides.md
  #   out: site/slides
  #   theme: seriph
  #   base: "./"

# ─── Shared inputs ──────────────────────────────────────────────────────────
# Read directly by <DataValue> in any output, via @modyfi/vite-plugin-yaml.
# Provenance fields are informational — surfaced in the panel, never executed.
variables: {}
  # example:
  # heritability_h2:
  #   value: 0.42
  #   format: ".2f"
  #   description: "SNP-based heritability of the focal trait"
  #   source: "data/ldsc.log"
  #   command: "python scripts/h2.py"
  #   updated: "2026-09-02"

# Rendered once to public/manim/<key>.<format> (+ a last-frame poster).
# Embed with <ManimFigure scene="<key>" /> in the blog, `layout: manim` in a deck.
scenes: {}
  # intro:
  #   source: "scenes/intro.py"
  #   class: "IntroScene"
  #   quality: "h"
  #   format: "webm"

# Excalidraw sources exported to public/figures/<key>.<format>.
# Embed with <FigureImage figure="<key>" />.
figures: {}

# ─── Bibliography ───────────────────────────────────────────────────────────
# LaTeX-shaped citing: \cite{key} in a document, \bibliography where the
# reference list should go. Parsed and formatted at build time, so the page
# ships plain anchors — no citation runtime.
bibliography:
  sources: ["refs.bib"]
  style: numeric        # numeric → [1]  |  author-year → (Visscher et al., 2008)
  sort: appearance      # appearance | author | year
  title: "References"

# ─── Math ───────────────────────────────────────────────────────────────────
# TeX settings shared by every output. Macros belong HERE rather than in a
# \newcommand inside a document: the renderer keeps one TeX instance for the
# whole build, so an in-document definition leaks into every later block and
# page, and whether it resolves depends on source order.
math:
  # tags: ams          # number display equations and enable \label / \eqref.
                       # Counters run across the whole build and their starting
                       # point depends on page order — fine for a single-page
                       # post, but prefer explicit \tag{…} once there are
                       # several pages, or reset with \setcounter{equation}{0}.
  macros:
    E: "\\operatorname{E}"
    Var: "\\operatorname{Var}"
    Cov: "\\operatorname{Cov}"
    given: "\\mid"
    RR: "\\mathbb{R}"
    norm: ["\\left\\lVert #1 \\right\\rVert", 1]

  # environments: true   # allow bare \begin{align} … \end{align} at block
                         # level, with no surrounding $$. Set false to require
                         # $$ fencing, or pass an explicit list of env names.
